[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claudios"
version = "0.1.0"
description = "Website checks, SEO & diagnostics (HTML, CSS, JS, security)"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "dnspython[doh]>=2.6",
  "publicsuffix2>=2.20190000",
]

[project.optional-dependencies]
gui = ["PySide6>=6.7"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

# Bewusst KEIN [project.scripts]: Scans sind nur über die GUI startbar.

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
claudios = ["i18n/*.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
