name: Sicherheitsprüfung
# Auf Knopfdruck und jeden Montag (Abhängigkeiten und Geheimnisse regelmäßig prüfen, auch das Playwright-Lockfile).
on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7
        with:
          node-version: "22"
      - name: Programm und Prüfwerkzeuge installieren
        run: |
          python -m venv /tmp/app
          /tmp/app/bin/pip install -e ".[gui]"
          /tmp/app/bin/pip freeze --exclude-editable > /tmp/freeze.txt
          pip install bandit pip-audit
      - name: Stückliste (SBOM) erzeugen
        run: /tmp/app/bin/python tools/make_sbom.py sbom.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: sbom
          path: sbom.json
      - name: Sicherheitsprüfungen
        run: |
          set +e
          FAIL=0
          D=src/claudios/components
          report() {
            if [ "$2" -eq 0 ]; then
              echo "::notice title=$1::keine Funde"
            else
              FAIL=1
              echo "::error title=$1::$(head -c 800 "$3" | tr '\n' ' ')"
            fi
          }
          bandit -r src -ll -q > /tmp/bandit.txt 2>&1
          report "bandit (Python-Code)" $? /tmp/bandit.txt
          pip-audit -r /tmp/freeze.txt --no-deps > /tmp/pipaudit.txt 2>&1
          report "pip-audit (Programm)" $? /tmp/pipaudit.txt
          python - <<'PY'
          import json, pathlib
          text = json.load(open("src/claudios/components/pip-sslyze.json"))["requirements"]
          pathlib.Path("/tmp/sslyze-req.txt").write_text(text)
          PY
          echo "::notice title=sslyze gepinnt::$(grep -E '^(sslyze|cryptography|nassl)==' /tmp/sslyze-req.txt | tr '\n' ' ')"
          pip-audit -r /tmp/sslyze-req.txt --no-deps --disable-pip > /tmp/sslyze-audit.txt 2>&1
          report "pip-audit (sslyze)" $? /tmp/sslyze-audit.txt
          for pair in "package.json:package-lock.json" "pw-package.json:pw-package-lock.json"; do
            PKG=${pair%%:*}
            LOCK=${pair##*:}
            mkdir -p "/tmp/n-$PKG"
            cp "$D/npm/$PKG" "/tmp/n-$PKG/package.json"
            cp "$D/npm/$LOCK" "/tmp/n-$PKG/package-lock.json"
            (cd "/tmp/n-$PKG" && npm audit --audit-level=high) > "/tmp/npm-$PKG.txt" 2>&1
            report "npm audit ($LOCK)" $? "/tmp/npm-$PKG.txt"
          done
          exit $FAIL

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
      - name: Gitleaks laden (Prüfsumme fest eingetragen) und die ganze Historie prüfen
        run: |
          V=8.30.0
          curl -sSL -o /tmp/gl.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${V}/gitleaks_${V}_linux_x64.tar.gz"
          echo "79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e  /tmp/gl.tgz" | sha256sum -c - || { echo "::error::Pruefsumme falsch, Abbruch"; exit 1; }
          tar -xzf /tmp/gl.tgz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --redact --no-banner --verbose
