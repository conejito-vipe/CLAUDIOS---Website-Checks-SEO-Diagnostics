name: Windows-Build und Installer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[gui]" pyinstaller pillow
      - run: python tools/count_loc.py
      - name: Symbol und Installer-Bilder erzeugen
        run: |
          python tools/make_installer_art.py
          if ($LASTEXITCODE -ne 0) { Write-Host "::warning title=Symbol::Symbol und Bilder konnten nicht erzeugt werden, es gelten die Standardbilder" }
          exit 0
      - name: Programm bauen (onedir, ohne Konsolenfenster)
        run: |
          $opts = @("--noconfirm", "--onedir", "--windowed", "--name", "CLAUDIOS")
          if (Test-Path installer\art\app.ico) { $opts += @("--icon", "installer\art\app.ico") }
          $opts += @("--collect-submodules", "claudios", "--collect-data", "claudios")
          foreach ($pkg in @("httpx", "httpcore", "h2", "hpack", "hyperframe", "dns", "anyio", "h11", "idna", "sniffio", "certifi")) {
            $opts += @("--collect-submodules", $pkg)
          }
          $opts += @("--collect-data", "certifi", "--hidden-import", "dns.query")
          $opts += @("--add-data", "assets;claudios/assets", "installer/launcher.py")
          pyinstaller @opts
      - name: Installer bauen (Inno Setup)
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\claudios.iss
      - name: Prüfsumme berechnen
        run: |
          Get-FileHash installer\Output\*.exe -Algorithm SHA256 | Format-List | Out-String | Write-Host
      - uses: actions/upload-artifact@v7
        with:
          name: CLAUDIOS-Setup
          path: installer/Output/*.exe
