name: Release
# Nur auf Knopfdruck (Actions > Release > Run workflow). Die Tests laufen zuerst, dann wird der Windows-Installer gebaut.
# Ergebnis im Release v<Version> (Version aus src/claudios/__init__.py):
#   - CLAUDIOS-Setup-<Version>.exe         Windows-Installer (die Aktualisierung im Programm lädt genau diese Datei)
#   - CLAUDIOS-Setup-<Version>.exe.sha256  Prüfsumme dazu (der Installer wird nur nach erfolgreicher Prüfung gestartet)
#   - CLAUDIOS_v<Version>_Mac.zip          Mac-Programm CLAUDIOS.app (nur Apple-Chip (arm64); ad-hoc signiert), mit .sha256
#   - SHA256SUMS.txt                       Prüfsummen aller Dateien
# Ohne Häkchen entsteht ein normales, sofort öffentliches Release. Ein Entwurf ist für die Update-Funktion unsichtbar.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Als Release veröffentlichen (Voraussetzung für die Update-Funktion im Programm)"
        type: boolean
        default: true
      draft:
        description: "Nur als Entwurf anlegen (nicht öffentlich, zum Prüfen)"
        type: boolean
        default: false
      prerelease:
        description: "Als Vorabversion markieren (die Update-Funktion ignoriert sie)"
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: "3.12"
      - name: Systembibliotheken für Qt (ohne Bildschirm)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libglib2.0-0
      - run: pip install -e ".[dev,gui]"
      - run: ruff check src tests tools
      - run: pytest -v -o faulthandler_timeout=90

  mac:
    needs: tests
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[gui]" pyinstaller pillow
      - name: Version bestimmen
        id: ver
        run: echo "version=$(python -c 'import claudios; print(claudios.__version__)')" >> "$GITHUB_OUTPUT"
      - name: Symbol erzeugen
        run: python tools/make_installer_art.py || echo "::warning title=Symbol::Symbol konnte nicht erzeugt werden, es gilt das Standardsymbol"
      - name: Mac-Programm bauen (CLAUDIOS.app, ohne Python beim Nutzer)
        run: |
          opts=(--noconfirm --windowed --name CLAUDIOS --osx-bundle-identifier de.conejito.claudios)
          if [ -f installer/art/app.icns ]; then opts+=(--icon installer/art/app.icns); fi
          opts+=(--collect-submodules claudios --collect-data claudios)
          for pkg in httpx httpcore h2 hpack hyperframe dns anyio h11 idna sniffio certifi; do opts+=(--collect-submodules "$pkg"); done
          for pkg in httpx httpcore h2 dnspython; do opts+=(--copy-metadata "$pkg"); done
          opts+=(--collect-data certifi --hidden-import dns.query --add-data "assets:claudios/assets" installer/launcher.py)
          pyinstaller "${opts[@]}"
          plutil -replace CFBundleShortVersionString -string "${{ steps.ver.outputs.version }}" dist/CLAUDIOS.app/Contents/Info.plist
          plutil -replace CFBundleVersion -string "${{ steps.ver.outputs.version }}" dist/CLAUDIOS.app/Contents/Info.plist
          # Ad-hoc-Signatur: Apple-Chips starten nur signierte Programme. Ohne Apple-Entwicklerkonto gibt es keine Notarisierung.
          codesign --force --deep --sign - dist/CLAUDIOS.app
          codesign --verify --deep --strict dist/CLAUDIOS.app
      - name: Selbsttest der gebauten App (Statusbericht)
        run: |
          CLAUDIOS_SELFTEST_OUT="$PWD/selftest-mac.json" dist/CLAUDIOS.app/Contents/MacOS/CLAUDIOS --selftest || { cat selftest-mac.json || true; exit 1; }
          cat selftest-mac.json
      - name: Zip und Prüfsumme
        run: |
          zip="CLAUDIOS_v${{ steps.ver.outputs.version }}_Mac.zip"
          ditto -c -k --keepParent dist/CLAUDIOS.app "$zip"
          shasum -a 256 "$zip" | sed 's/ \*/  /' > "$zip.sha256"
          cat "$zip.sha256"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: mac
          path: |
            CLAUDIOS_v*_Mac.zip
            CLAUDIOS_v*_Mac.zip.sha256
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        if: always()
        with:
          name: Statusbericht-Mac
          path: selftest-mac.json
          if-no-files-found: ignore

  build:
    needs: [tests, mac]
    runs-on: windows-latest
    permissions:
      contents: write
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[gui]" pyinstaller pillow
      - run: python tools/count_loc.py
      - name: Version bestimmen
        id: ver
        run: |
          $match = Select-String -Path src\claudios\__init__.py -Pattern '__version__\s*=\s*["'']([^"'']+)["'']'
          if (-not $match) { Write-Error "__version__ nicht gefunden"; exit 1 }
          Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$($match.Matches[0].Groups[1].Value)"
      - name: Symbol und Installer-Bilder erzeugen
        run: |
          python tools/make_installer_art.py
          if ($LASTEXITCODE -ne 0) { Write-Host "::warning title=Symbol::Symbol und Bilder konnten nicht erzeugt werden, es gelten die Standardbilder" }
          exit 0
      - name: Programm bauen (onedir, ohne Konsolenfenster)
        run: |
          $opts = @("--noconfirm", "--onedir", "--windowed", "--name", "CLAUDIOS")
          if (Test-Path installer\art\app.ico) { $opts += @("--icon", "installer\art\app.ico") }
          $opts += @("--collect-submodules", "claudios", "--collect-data", "claudios")
          foreach ($pkg in @("httpx", "httpcore", "h2", "hpack", "hyperframe", "dns", "anyio", "h11", "idna", "sniffio", "certifi")) {
            $opts += @("--collect-submodules", $pkg)
          }
          # dnspython prueft die Paket-Metadaten (have_doh); ohne sie meldet es "NoDOH"
          foreach ($pkg in @("httpx", "httpcore", "h2", "dnspython")) {
            $opts += @("--copy-metadata", $pkg)
          }
          $opts += @("--collect-data", "certifi", "--hidden-import", "dns.query")
          $opts += @("--add-data", "assets;claudios/assets", "installer/launcher.py")
          pyinstaller @opts
      - name: Selbsttest der gebauten Programmdatei (Statusbericht)
        run: |
          $env:CLAUDIOS_SELFTEST_OUT = "$PWD\selftest-exe.json"
          $p = Start-Process -FilePath "dist\CLAUDIOS\CLAUDIOS.exe" -ArgumentList "--selftest" -Wait -PassThru
          if (Test-Path selftest-exe.json) { Get-Content selftest-exe.json } else { Write-Host "::error::Kein Statusbericht erzeugt" }
          if ($p.ExitCode -ne 0) { throw "Selbsttest der Programmdatei fehlgeschlagen (Code $($p.ExitCode))" }
      - name: Installer bauen (Inno Setup)
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.ver.outputs.version }}" installer\claudios.iss
      - name: Installer ausprobieren (still installieren, Selbsttest, deinstallieren)
        run: |
          $exe = Get-ChildItem installer\Output\CLAUDIOS-Setup-*.exe | Select-Object -First 1
          $dir = Join-Path $env:RUNNER_TEMP "claudios-installiert"
          # Nicht -Wait: das wartet auch auf die vom Installer gestartete App und hängt dann
          $p = Start-Process -FilePath $exe.FullName -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=$dir", "/LOG=$PWD\setup-log.txt" -PassThru
          if (-not $p.WaitForExit(300000)) { $p.Kill(); throw "Installation dauert zu lange" }
          if ($p.ExitCode -ne 0) { throw "Installation fehlgeschlagen (Code $($p.ExitCode))" }
          Start-Sleep -Seconds 3
          Get-Process -Name CLAUDIOS -ErrorAction SilentlyContinue | Stop-Process -Force
          if (-not (Test-Path "$dir\CLAUDIOS.exe")) { throw "CLAUDIOS.exe fehlt nach der Installation" }
          $env:CLAUDIOS_SELFTEST_OUT = "$PWD\selftest-installiert.json"
          $t = Start-Process -FilePath "$dir\CLAUDIOS.exe" -ArgumentList "--selftest" -PassThru
          if (-not $t.WaitForExit(300000)) { $t.Kill(); throw "Selbsttest des installierten Programms hängt" }
          if (Test-Path selftest-installiert.json) { Get-Content selftest-installiert.json } else { Write-Host "::error::Kein Statusbericht erzeugt" }
          if ($t.ExitCode -ne 0) { throw "Selbsttest des installierten Programms fehlgeschlagen (Code $($t.ExitCode))" }
          $u = Start-Process -FilePath "$dir\unins000.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -PassThru
          if (-not $u.WaitForExit(300000)) { $u.Kill(); throw "Deinstallation dauert zu lange" }
          Start-Sleep -Seconds 3
          if ($u.ExitCode -ne 0) { throw "Deinstallation fehlgeschlagen (Code $($u.ExitCode))" }
          if (Test-Path "$dir\CLAUDIOS.exe") { throw "CLAUDIOS.exe blieb nach der Deinstallation übrig" }
      - name: Prüfsumme berechnen und als Datei ablegen
        run: |
          $exe = Get-ChildItem installer\Output\CLAUDIOS-Setup-*.exe | Select-Object -First 1
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          Write-Host "SHA256: $hash  $($exe.Name)"
          "$hash  $($exe.Name)" | Set-Content -Path "$($exe.FullName).sha256" -Encoding ascii
          "$hash  $($exe.Name)" | Set-Content -Path "installer\Output\SHA256SUMS.txt" -Encoding ascii
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        if: always()
        with:
          name: Statusberichte
          path: |
            selftest-*.json
            setup-log.txt
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: CLAUDIOS-Setup
          path: |
            installer/Output/*.exe
            installer/Output/*.sha256
            installer/Output/SHA256SUMS.txt
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7
        with:
          name: mac
          path: mac-dl
      - name: Release veröffentlichen
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
          DRAFT: ${{ inputs.draft }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          $tag = "v$env:VERSION"
          $macZip = Get-ChildItem mac-dl\CLAUDIOS_v*_Mac.zip | Select-Object -First 1
          Add-Content -Path installer\Output\SHA256SUMS.txt -Value (Get-Content "$($macZip.FullName).sha256")
          $files = @(Get-ChildItem installer\Output\CLAUDIOS-Setup-*.exe, installer\Output\CLAUDIOS-Setup-*.exe.sha256, installer\Output\SHA256SUMS.txt | ForEach-Object { $_.FullName })
          $files += $macZip.FullName
          $files += "$($macZip.FullName).sha256"
          $notes = "Installer mit Prüfsumme (SHA256-Datei liegt dabei). Installer with checksum (SHA256 file attached)."
          $flags = @()
          if ($env:DRAFT -eq "true") { $flags += "--draft" }
          if ($env:PRERELEASE -eq "true") { $flags += "--prerelease" }
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag besteht schon: Dateien werden ersetzt."
            gh release upload $tag @files --clobber
            if ($LASTEXITCODE -ne 0) { throw "Hochladen fehlgeschlagen" }
          } else {
            gh release create $tag @files --target $env:GITHUB_SHA --title "CLAUDIOS $env:VERSION" --notes $notes @flags
            if ($LASTEXITCODE -ne 0) { throw "Release anlegen fehlgeschlagen" }
          }
