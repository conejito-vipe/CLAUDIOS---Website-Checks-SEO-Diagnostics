name: Release
# Nur auf Knopfdruck (Actions > Release > Run workflow). Die Tests laufen zuerst, dann wird der Windows-Installer gebaut.
# Ergebnis im Release v<Version> (Version aus src/claudios/__init__.py):
#   - CLAUDIOS-Setup-<Version>.exe         Windows-Installer (die Aktualisierung im Programm lädt genau diese Datei)
#   - CLAUDIOS-Setup-<Version>.exe.sha256  Prüfsumme dazu (der Installer wird nur nach erfolgreicher Prüfung gestartet)
#   - SHA256SUMS.txt                       Prüfsummen aller Dateien
# Ohne Häkchen entsteht ein normales, sofort öffentliches Release. Ein Entwurf ist für die Update-Funktion unsichtbar.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Als Release veröffentlichen (Voraussetzung für die Update-Funktion im Programm)"
        type: boolean
        default: true
      draft:
        description: "Nur als Entwurf anlegen (nicht öffentlich, zum Prüfen)"
        type: boolean
        default: false
      prerelease:
        description: "Als Vorabversion markieren (die Update-Funktion ignoriert sie)"
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,gui]"
      - run: ruff check src tests tools
      - run: pytest -q

  build:
    needs: tests
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[gui]" pyinstaller pillow
      - run: python tools/count_loc.py
      - name: Version bestimmen
        id: ver
        run: |
          $match = Select-String -Path src\claudios\__init__.py -Pattern '__version__\s*=\s*["'']([^"'']+)["'']'
          if (-not $match) { Write-Error "__version__ nicht gefunden"; exit 1 }
          Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$($match.Matches[0].Groups[1].Value)"
      - name: Symbol und Installer-Bilder erzeugen
        run: |
          python tools/make_installer_art.py
          if ($LASTEXITCODE -ne 0) { Write-Host "::warning title=Symbol::Symbol und Bilder konnten nicht erzeugt werden, es gelten die Standardbilder" }
          exit 0
      - name: Programm bauen (onedir, ohne Konsolenfenster)
        run: |
          $opts = @("--noconfirm", "--onedir", "--windowed", "--name", "CLAUDIOS")
          if (Test-Path installer\art\app.ico) { $opts += @("--icon", "installer\art\app.ico") }
          $opts += @("--collect-submodules", "claudios", "--collect-data", "claudios")
          foreach ($pkg in @("httpx", "httpcore", "h2", "hpack", "hyperframe", "dns", "anyio", "h11", "idna", "sniffio", "certifi")) {
            $opts += @("--collect-submodules", $pkg)
          }
          # dnspython prueft die Paket-Metadaten (have_doh); ohne sie meldet es "NoDOH"
          foreach ($pkg in @("httpx", "httpcore", "h2", "dnspython")) {
            $opts += @("--copy-metadata", $pkg)
          }
          $opts += @("--collect-data", "certifi", "--hidden-import", "dns.query")
          $opts += @("--add-data", "assets;claudios/assets", "installer/launcher.py")
          pyinstaller @opts
      - name: Installer bauen (Inno Setup)
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.ver.outputs.version }}" installer\claudios.iss
      - name: Prüfsumme berechnen und als Datei ablegen
        run: |
          $exe = Get-ChildItem installer\Output\CLAUDIOS-Setup-*.exe | Select-Object -First 1
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          Write-Host "SHA256: $hash  $($exe.Name)"
          "$hash  $($exe.Name)" | Set-Content -Path "$($exe.FullName).sha256" -Encoding ascii
          "$hash  $($exe.Name)" | Set-Content -Path "installer\Output\SHA256SUMS.txt" -Encoding ascii
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: CLAUDIOS-Setup
          path: |
            installer/Output/*.exe
            installer/Output/*.sha256
            installer/Output/SHA256SUMS.txt
      - name: Release veröffentlichen
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
          DRAFT: ${{ inputs.draft }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          $tag = "v$env:VERSION"
          $files = @(Get-ChildItem installer\Output\CLAUDIOS-Setup-*.exe, installer\Output\CLAUDIOS-Setup-*.exe.sha256, installer\Output\SHA256SUMS.txt | ForEach-Object { $_.FullName })
          $notes = "Installer mit Prüfsumme (SHA256-Datei liegt dabei). Installer with checksum (SHA256 file attached)."
          $flags = @()
          if ($env:DRAFT -eq "true") { $flags += "--draft" }
          if ($env:PRERELEASE -eq "true") { $flags += "--prerelease" }
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag besteht schon: Dateien werden ersetzt."
            gh release upload $tag @files --clobber
            if ($LASTEXITCODE -ne 0) { throw "Hochladen fehlgeschlagen" }
          } else {
            gh release create $tag @files --target $env:GITHUB_SHA --title "CLAUDIOS $env:VERSION" --notes $notes @flags
            if ($LASTEXITCODE -ne 0) { throw "Release anlegen fehlgeschlagen" }
          }
