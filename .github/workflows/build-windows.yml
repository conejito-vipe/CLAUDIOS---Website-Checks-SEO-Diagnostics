name: Windows-Build und Installer
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[gui]" pyinstaller
      - run: python tools/count_loc.py
      - name: Symbol erzeugen (nur falls assets/claudios.ico fehlt)
        run: |
          if (-not (Test-Path assets\claudios.ico)) {
            pip install pillow
            python tools/make_icon.py
            if ($LASTEXITCODE -ne 0) { Write-Host "::warning title=Symbol::Symbol konnte nicht erzeugt werden, es gilt das Standardsymbol" }
          }
          exit 0
      - name: Programm bauen (onedir, ohne Konsolenfenster)
        run: |
          $icon = @()
          if (Test-Path assets\claudios.ico) { $icon = @("--icon", "assets\claudios.ico") }
          pyinstaller --noconfirm --onedir --windowed --name Claudios @icon --collect-submodules claudios --collect-data claudios --collect-submodules httpx --collect-submodules httpcore --collect-submodules h2 --collect-submodules hpack --collect-submodules hyperframe --add-data "assets;claudios/assets" installer/launcher.py
      - name: Installer bauen (Inno Setup)
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\claudios.iss
      - name: Prüfsumme berechnen
        run: |
          Get-FileHash installer\Output\*.exe -Algorithm SHA256 | Format-List | Out-String | Write-Host
      - uses: actions/upload-artifact@v7
        with:
          name: Claudios-Setup
          path: installer/Output/*.exe
