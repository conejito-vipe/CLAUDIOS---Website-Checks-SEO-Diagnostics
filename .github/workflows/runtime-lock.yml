name: Laufzeit-Sperrdatei erzeugen (Python-Laufzeit und pip)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: "3.12"
      - name: Prüfsummen ermitteln
        run: python tools/make_runtime_lock.py
      - name: Datei hochladen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/claudios/components/runtime-lock.json
          git diff --cached --quiet || (git commit -m "Add runtime lock (Python embeddable and pip wheel with SHA256)" && git push)
