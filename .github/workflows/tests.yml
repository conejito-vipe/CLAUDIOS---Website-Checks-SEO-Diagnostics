name: Tests
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Qt-Bibliotheken
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libglib2.0-0
      - run: pip install -e ".[dev,gui]"
      - run: ruff check .
      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          pytest -q -p no:cacheprovider > pytest.txt 2>&1 || true
          tail -25 pytest.txt
          ! grep -qE "[0-9]+ (failed|errors?)" pytest.txt
