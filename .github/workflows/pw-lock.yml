name: Playwright-Sperrdatei erzeugen
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Sperrdatei erzeugen
        run: |
          D=src/claudios/components/npm
          mkdir -p /tmp/pw
          cp $D/pw-package.json /tmp/pw/package.json
          cd /tmp/pw
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          cp /tmp/pw/package-lock.json "$GITHUB_WORKSPACE/$D/pw-package-lock.json"
      - name: Sperrdatei hochladen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/claudios/components/npm/pw-package-lock.json
          git diff --cached --quiet || (git commit -m "Add Playwright lock file (pinned versions with integrity hashes)" && git push)
      - name: Installieren und Skript ausprobieren
        run: |
          set +e
          D=$GITHUB_WORKSPACE/src/claudios/components/npm
          mkdir -p /tmp/run && cd /tmp/run
          cp $D/pw-package.json package.json
          cp $D/pw-package-lock.json package-lock.json
          cp $D/browser_probe.js .
          npm ci --ignore-scripts --no-audit --no-fund > ci.txt 2>&1
          echo "npm ci exit $?" > codes.txt
          export PLAYWRIGHT_BROWSERS_PATH=/tmp/run/browsers
          node node_modules/playwright/cli.js install --with-deps chromium > inst.txt 2>&1
          echo "install exit $?" >> codes.txt
          cat > in.json <<'EOF'
          {"urls":["https://example.com/"],"host":"example.com","registrable":"example.com","ip":"","ua_suffix":"Claudios-lock-test","axe":true}
          EOF
          node browser_probe.js in.json out.json > run.txt 2> run.err
          echo "probe exit $?" >> codes.txt
          echo "::notice title=Exit-Codes::$(tr '\n' ' ' < codes.txt)"
          echo "::notice title=out.json::$(head -c 900 out.json 2>/dev/null | tr '\n' ' ')"
          for f in run.err run.txt; do
            echo "::notice title=$f::$(head -c 500 $f 2>/dev/null | tr '\n' ' ')"
          done
          exit 0
