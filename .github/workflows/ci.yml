name: CI
# Läuft bei jedem Push auf main, bei Pull Requests und auf Knopfdruck (Actions > CI > Run workflow).
# Linux und Windows: das Programm läuft auf Windows, die Tests laufen auch auf Linux (Qt ohne Bildschirm).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: "3.12"
      - name: Systembibliotheken für Qt (ohne Bildschirm)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libglib2.0-0
      - run: pip install -e ".[dev,gui]"
      - run: ruff check src tests tools
      - run: pytest -q
      - run: python tools/count_loc.py
