name: Laufzeit-Messung (Python-Laufzeit und Browser)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python-runtime:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/measure_runtime.py python-embed
  browsers:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: python tools/measure_runtime.py browsers
