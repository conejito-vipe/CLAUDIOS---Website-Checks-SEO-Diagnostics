name: Autofix und Dateiprüfung
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: "3.12"
      - name: Dateien prüfen
        run: python tools/check_files.py
      - name: ruff reparieren
        run: |
          pip install ruff
          ruff check src tests tools --fix --output-format concise || true
      - name: Korrekturen hochladen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Autofix: ruff --fix" && git push)
      - name: Verbleibende ruff-Hinweise anzeigen
        run: |
          pip install ruff
          ruff check src tests tools --output-format concise