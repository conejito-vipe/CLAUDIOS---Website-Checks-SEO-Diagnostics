name: vnu spiegeln (feste Version im eigenen Release)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  spiegeln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: "3.12"
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880  # v6
        with:
          distribution: temurin
          java-version: "21"
      - name: vnu.jar prüfen, spiegeln und Sperrdatei aktualisieren
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: python tools/mirror_vnu.py
      - name: Sperrdatei hochladen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/claudios/components/components.lock.json
          git diff --cached --quiet || (git commit -m "Pin vnu to a mirrored fixed release" && git push)
