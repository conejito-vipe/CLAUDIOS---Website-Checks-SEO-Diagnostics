name: pip-Sperrliste für sslyze erzeugen
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Liste mit Prüfsummen für alle Plattformen erzeugen
        run: |
          pip install uv
          echo "sslyze>=6,<7" > /tmp/req.in
          echo "cryptography>=48.0.1" >> /tmp/req.in
          if uv pip compile /tmp/req.in --universal --generate-hashes --python-version 3.12 --no-header -o /tmp/req.txt; then
            echo "::notice title=cryptography::Mindestversion 48.0.1 ist mit sslyze vereinbar"
          else
            echo "::warning title=cryptography::sslyze erlaubt keine neuere cryptography, es wird die ältere Version mit bekannten Lücken gepinnt"
            echo "sslyze>=6,<7" > /tmp/req.in
            uv pip compile /tmp/req.in --universal --generate-hashes --python-version 3.12 --no-header -o /tmp/req.txt
          fi
          echo "::notice title=Gepinnt::$(grep -E '^(sslyze|cryptography|nassl)==' /tmp/req.txt | tr '\n' ' ')"
          python - <<'PY'
          import json, pathlib
          text = pathlib.Path("/tmp/req.txt").read_text()
          assert "--hash=sha256:" in text
          pathlib.Path("src/claudios/components/pip-sslyze.json").write_text(
              json.dumps({"python": "3.12", "requirements": text}, indent=2) + "\n")
          PY
      - name: Liste hochladen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/claudios/components/pip-sslyze.json
          git diff --cached --quiet || (git commit -m "Update pip lock for sslyze (pinned versions with hashes)" && git push)
      - name: Installation mit Prüfsummen ausprobieren (wie im Programm)
        run: |
          python -m venv /tmp/env
          /tmp/env/bin/pip install --require-hashes --no-deps --only-binary=:all: --no-binary=sslyze --disable-pip-version-check -r /tmp/req.txt
          /tmp/env/bin/python -m sslyze --help | head -n 5
      - name: sslyze mit der gewählten Version ausprobieren
        run: |
          set +e
          IP=$(getent ahostsv4 example.com | awk '{print $1}' | head -n 1)
          cd /tmp
          /tmp/env/bin/python -m sslyze --tlsv1_3 --certinfo --json_out out.json "example.com:443{$IP}" > o.txt 2> e.txt
          echo "::notice title=Exit-Code::sslyze exit $?"
          echo "::notice title=o.txt::$(head -c 500 o.txt 2>/dev/null | tr '\n' ' ')"
          echo "::notice title=e.txt::$(head -c 500 e.txt 2>/dev/null | tr '\n' ' ')"
          exit 0
