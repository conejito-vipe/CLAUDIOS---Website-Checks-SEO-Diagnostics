name: Werkzeug-Prüfsummen eintragen
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install httpx
      - id: lock
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/update_lock.py
      - name: Ergebnis hochladen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/claudios/components/components.lock.json
          git diff --cached --quiet || (git commit -m "Update component lock (version, URL, SHA256)" && git push)
      - name: Fehlschlag melden
        if: steps.lock.outcome == 'failure'
        run: exit 1
