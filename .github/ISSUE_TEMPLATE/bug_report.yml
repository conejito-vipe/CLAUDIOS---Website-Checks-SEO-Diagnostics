name: Bug report / Fehlermeldung
description: Something does not work / Etwas funktioniert nicht
body:
  - type: markdown
    attributes:
      value: "Please do not paste passwords, tokens, cookie values or private URLs. / Bitte keine Passwörter, Tokens, Cookie-Werte oder private Adressen einfügen."
  - type: input
    id: version
    attributes:
      label: Claudios version / Version
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened? / Was ist passiert?
      description: Include the error code (for example CLA-TLS-001) if shown. / Fehlercode angeben, falls angezeigt.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / Schritte zum Nachstellen
